<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AnotPanda</title>

<style>

*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
  margin:0;
  padding:0;
}

:root{
  --bg:#e2bd98;
  --notebook:#f1f1f138;
  --header:#ffffff2a;
  --tabs:#ffffff36;
  --tabActive:#ffffff4b;
  --button:#704d37;
  --buttonHover:#8a6247;
  --page:#ffffff56;
  --footer:#ffffff2f;
  --text:#000000;
}

body{
  background-color:var(--bg);
  display:flex;
  height:100vh;
  overflow:hidden;
  transition:0.3s;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

/* SIDEBAR */

.sidebar{
  width:85px;
  background:var(--button);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 10px;
  gap:20px;
  transition:0.3s;
}

/* MENU */

.menu-container{
  position:relative;
}

.menu-btn{
  width:50px;
  height:50px;
  border:none;
  border-radius:15px;
  font-size:24px;
  background:#00000063;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.menu-btn:hover{
  background:#000000;
}

.menu-dropdown{
  display:none;
  position:absolute;
  top:0;
  left:70px;
  background:#ffffffee;
  padding:15px;
  border-radius:15px;
  min-width:220px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
  z-index:100;
}

.show-menu{
  display:block;
}

.menu-dropdown p{
  color:black;
  margin-bottom:10px;
  font-weight:bold;
}

/* CORES */

.theme-option{
  width:100%;
  margin-bottom:8px;
  border:none;
  padding:10px;
  border-radius:10px;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.purple{background:#7b2cbf;}
.red{background:#d62828;}
.blue{background:#1976d2;}
.yellow{background:#f9c74f;color:black;}
.black{background:#111111;}

.upload-bg{
  width:100%;
  margin-top:10px;
  background:#555;
  color:white;
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  display:block;
  text-align:center;
}

.remove-bg{
  width:100%;
  margin-top:8px;
  background:#c1121f;
  color:white;
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

/* CONTAINER */

.container{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOPO */

.topbar{
  height:80px;
  background:var(--button);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.logo{
  font-size:28px;
  font-family:cursive;
  font-weight:bold;
  color:white;
}

/* NOTEBOOK */

.notebook{
  flex:1;
  margin:20px;
  background:var(--notebook);
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  color:var(--text);
  transition:0.3s;
  backdrop-filter:blur(8px);
}

header{
  padding:16px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  background:var(--header);
}

/* ABAS */

.tabs{
  display:flex;
  background:var(--tabs);
  overflow-x:auto;
}

.tab{
  padding:12px 20px;
  text-align:center;
  cursor:pointer;
  font-weight:500;
  white-space:nowrap;
  position:relative;
  user-select:none;
  color:black;
}

.tab.active{
  background:var(--tabActive);
  border-bottom:3px solid var(--button);
}

.edit-btn{
  margin-left:8px;
  font-size:12px;
  cursor:pointer;
}

.delete-tab-btn{
  margin-left:6px;
  font-size:12px;
  cursor:pointer;
  color:red;
  font-weight:bold;
}

/* CONTEÚDO */

.content{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.page{
  display:none;
  width:100%;
  height:100%;
}

.page.active{
  display:block;
}

textarea{
  width:100%;
  height:100%;
  border:none;
  resize:none;
  outline:none;
  font-size:16px;
  line-height:1.6;
  padding:15px;
  border-radius:12px;
  background:var(--page);
  color:black;
}

textarea::placeholder{
  color:#000000;
}

/* FOOTER */

.footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  background:var(--footer);
}

button{
  background:var(--button);
  color:white;
  border:none;
  padding:8px 18px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  transition:0.3s;
}

button:hover{
  background:var(--buttonHover);
}

.status{
  font-size:14px;
  opacity:0.8;
}

</style>
</head>

<body>

<div class="sidebar">

  <div class="menu-container">

    <button class="menu-btn" onclick="toggleMenu()">
      ☰
    </button>

    <div class="menu-dropdown" id="menuDropdown">

      <button class="theme-option black"
      onclick="goHome()">
        🏠 Início
      </button>

      <button class="theme-option red"
      onclick="logout()">
        🚪 Sair
      </button>

      <p style="margin-top:15px;">
        🎨 Aparência
      </p>

      <button class="theme-option purple"
      onclick="setTheme('purple')">
        Roxo
      </button>

      <button class="theme-option red"
      onclick="setTheme('red')">
        Vermelho
      </button>

      <button class="theme-option blue"
      onclick="setTheme('blue')">
        Azul
      </button>

      <button class="theme-option yellow"
      onclick="setTheme('yellow')">
        Amarelo
      </button>

      <button class="theme-option black"
      onclick="setTheme('black')">
        Preto
      </button>

      <label class="upload-bg">

        📷 Colocar Fundo PNG

        <input
        type="file"
        accept="image/png, image/jpeg"
        onchange="changeBackground(event)"
        hidden>

      </label>

      <button class="remove-bg"
      onclick="removeBackground()">
        🗑 Remover Fundo
      </button>

    </div>

  </div>

</div>

<div class="container">

  <div class="topbar">

    <div class="logo">
      AnotPanda
    </div>

    <button onclick="addTab()">
      ＋ Nova Aba
    </button>

  </div>

  <div class="notebook">

    <header>
      ☘┋ 𝓑𝓵𝓸𝓬𝓸 𝓭𝓮 𝓝𝓸𝓽𝓪𝓼 ✿
    </header>

    <div class="tabs" id="tabsContainer"></div>

    <div class="content" id="contentContainer"></div>

    <div class="footer">

      <span class="status" id="status">
        Tudo salvo automaticamente
      </span>

      <button onclick="saveAll()">
        💾 Salvar
      </button>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {
  apiKey: "SUA_KEY",
  authDomain: "blocodenotas-c81fc.firebaseapp.com",
  projectId: "blocodenotas-c81fc",
  storageBucket: "blocodenotas-c81fc.firebasestorage.app",
  messagingSenderId: "521683003523",
  appId: "1:521683003523:web:dc216cf12e842a8f9b53b6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const status = document.getElementById('status');

let currentUser = null;
let currentBlock = localStorage.getItem("currentBlock") || "Bloco";

/* 🔥 FUNÇÃO PRINCIPAL (CORREÇÃO) */
function safeId(name){
  return name
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "_")
    .replace(/[^\w\-]/g, "");
}

/* MENU */

window.toggleMenu = function(){
  document.getElementById("menuDropdown").classList.toggle("show-menu");
}

window.onclick = function(event){
  if(!event.target.matches('.menu-btn')){
    let menu = document.getElementById("menuDropdown");
    if(menu.classList.contains("show-menu")){
      menu.classList.remove("show-menu");
    }
  }
}

/* HOME */
window.goHome = () => window.location.href = "https://manu140510.github.io/bnconta/";

/* LOGOUT */
window.logout = async () => {
  await signOut(auth);
  window.location.href = "https://manu140510.github.io/bnlogin/";
}

/* LOGIN */
onAuthStateChanged(auth, async (user) => {

  if(user){

    currentUser = user;

    loadAll();

  }else{

    console.log("Usuário NÃO logado");

    // window.location.href = "https://manu140510.github.io/bnlogin/";

  }
});

/* ABRIR ABA */
window.openTab = function(id){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  document.getElementById('tab-' + id).classList.add('active');
  document.getElementById(id).classList.add('active');
}

/* CRIAR ABA */
function createTab(name, content = ""){

  let safeName = safeId(name);

  const tabsContainer = document.getElementById("tabsContainer");
  const contentContainer = document.getElementById("contentContainer");

  let tab = document.createElement('div');
  tab.className = 'tab';
  tab.id = 'tab-' + safeName;

  if(document.querySelectorAll('.tab').length === 0){
    tab.classList.add('active');
  }

  tab.onclick = () => openTab(safeName);

  tab.innerHTML = `
    <span class="tab-title">${name}</span>
    <span class="edit-btn" onclick="editTab(event,'${name}')">✏</span>
    <span class="delete-tab-btn" onclick="deleteTab(event,'${name}')">✖</span>
  `;

  tabsContainer.appendChild(tab);

  let page = document.createElement('div');
  page.className = 'page';
  page.id = safeName;

  if(document.querySelectorAll('.page').length === 0){
    page.classList.add('active');
  }

  page.innerHTML = `
    <textarea id="text-${safeName}" placeholder="Escreva aqui...">${content}</textarea>
  `;

  contentContainer.appendChild(page);

  document.getElementById(`text-${safeName}`)
    .addEventListener('input', saveAll);
}

/* NOVA ABA */
window.addTab = function(){
  let name = prompt("Nome da nova aba:");
  if(!name || name.trim() === "") return;

  if(document.getElementById('tab-' + safeId(name))){
    alert("Já existe uma aba com esse nome!");
    return;
  }

  createTab(name);
  saveAll();
}

/* EDITAR */
window.editTab = function(event, oldName){
  event.stopPropagation();

  let newName = prompt("Novo nome:", oldName);
  if(!newName) return;

  let oldSafe = safeId(oldName);
  let text = document.getElementById("text-" + oldSafe).value;

  document.getElementById('tab-' + oldSafe).remove();
  document.getElementById(oldSafe).remove();

  createTab(newName, text);
  saveAll();
}

/* EXCLUIR */
window.deleteTab = function(event, name){
  event.stopPropagation();

  if(!confirm("Excluir aba?")) return;

  let safe = safeId(name);

  document.getElementById('tab-' + safe).remove();
  document.getElementById(safe).remove();

  saveAll();
}

/* SALVAR */
window.saveAll = async function(){

  if(!currentUser) return;

  let tabsData = [];

  document.querySelectorAll('.tab').forEach(tab => {

    let name = tab.querySelector('.tab-title').innerText;
    let safe = safeId(name);

    let textarea = document.getElementById('text-' + safe);
    if(!textarea) return;

    tabsData.push({
      name: name,
      text: textarea.value
    });

  });

  await setDoc(
    doc(db, "notas", currentUser.uid + "_" + currentBlock),
    {
      bloco: currentBlock,
      tabs: tabsData
    }
  );

  status.textContent = '✓ Salvo!';
  setTimeout(() => status.textContent = 'Tudo salvo automaticamente', 2000);
}

/* CARREGAR */
async function loadAll(){

  const docRef = doc(db, "notas", currentUser.uid + "_" + currentBlock);
  const docSnap = await getDoc(docRef);

  if(docSnap.exists()){
    docSnap.data().tabs.forEach(tab => {
      createTab(tab.name, tab.text);
    });
  }else{
    createTab("Redação");
    createTab("Anotações");
    createTab("Perguntas");
    saveAll();
  }
}

/* VISUAL */
window.onload = function(){

  let savedBg = localStorage.getItem('customBackground');
  if(savedBg){
    document.body.style.backgroundImage = `url('${savedBg}')`;
  }

  let savedTheme = localStorage.getItem("theme");
  if(savedTheme){
    setTheme(savedTheme);
  }
}

</script>

</body>
</html>
