<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnotPanda</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}

body{
  display:flex;
  height:100vh;
  background:#e2bd98;
}

.container{
  flex:1;
  display:flex;
  flex-direction:column;
}

.topbar{
  background:#704d37;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

.notebook{
  flex:1;
  margin:20px;
  background:#ffffff40;
  border-radius:15px;
  display:flex;
  flex-direction:column;
}

.tabs{
  display:flex;
  background:#ffffff50;
}

.tab{
  padding:10px;
  cursor:pointer;
}

.tab.active{
  background:#ffffff90;
}

.content{
  flex:1;
}

.page{
  display:none;
  height:100%;
}

.page.active{
  display:block;
}

textarea{
  width:100%;
  height:100%;
  border:none;
  padding:15px;
}

.footer{
  padding:10px;
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <h2>AnotPanda</h2>
    <button onclick="addTab()">+ Nova Aba</button>
  </div>

  <div class="notebook">

    <div class="tabs" id="tabs"></div>

    <div class="content" id="content"></div>

    <div class="footer">
      <span id="status">Auto</span>
      <button onclick="saveAll()">Salvar</button>
    </div>

  </div>

</div>

<script>
let tabCount = 0;

function openTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

  document.getElementById('tab-'+id).classList.add('active');
  document.getElementById('page-'+id).classList.add('active');
}

function createTab(name, content=""){
  const id = "tab"+tabCount++;

  const tab = document.createElement("div");
  tab.className="tab";
  tab.id="tab-"+id;
  tab.innerText=name;
  tab.onclick=()=>openTab(id);

  document.getElementById("tabs").appendChild(tab);

  const page = document.createElement("div");
  page.className="page";
  page.id="page-"+id;

  const textarea = document.createElement("textarea");
  textarea.value = content;

  page.appendChild(textarea);
  document.getElementById("content").appendChild(page);

  if(document.querySelectorAll('.tab').length===1){
    openTab(id);
  }
}

function addTab(){
  const name = prompt("Nome da aba:");
  if(!name) return;
  createTab(name);
}

function saveAll(){
  let data=[];

  document.querySelectorAll('.page').forEach((page,i)=>{
    const text = page.querySelector("textarea").value;

    data.push({
      name: document.querySelectorAll('.tab')[i].innerText,
      text: text
    });
  });

  localStorage.setItem("tabs", JSON.stringify(data));

  document.getElementById("status").innerText="Salvo!";
}

function load(){
  const data = JSON.parse(localStorage.getItem("tabs"));

  if(data){
    data.forEach(t=>createTab(t.name, t.text));
  }else{
    createTab("Redação");
    createTab("Anotações");
  }
}

load();
</script>

</body>
</html>
