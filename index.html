<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AnotPanda</title>

<style>
/* (SEU CSS ORIGINAL — NÃO MUDEI NADA) */
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif;margin:0;padding:0;}
:root{
  --bg:#e2bd98;
  --notebook:#f1f1f138;
  --header:#ffffff2a;
  --tabs:#ffffff36;
  --tabActive:#ffffff4b;
  --button:#704d37;
  --buttonHover:#8a6247;
  --page:#ffffff56;
  --footer:#ffffff2f;
  --text:#000000;
}
body{
  background-color:var(--bg);
  display:flex;
  height:100vh;
  overflow:hidden;
  transition:0.3s;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}
.sidebar{width:85px;background:var(--button);display:flex;flex-direction:column;align-items:center;padding:20px 10px;gap:20px;}
.menu-container{position:relative;}
.menu-btn{width:50px;height:50px;border:none;border-radius:15px;font-size:24px;background:#00000063;color:white;cursor:pointer;}
.menu-dropdown{display:none;position:absolute;top:0;left:70px;background:#ffffffee;padding:15px;border-radius:15px;min-width:220px;}
.show-menu{display:block;}
.container{flex:1;display:flex;flex-direction:column;}
.topbar{height:80px;background:var(--button);display:flex;align-items:center;justify-content:space-between;padding:0 25px;}
.logo{font-size:28px;font-family:cursive;font-weight:bold;color:white;}
.notebook{flex:1;margin:20px;background:var(--notebook);border-radius:16px;display:flex;flex-direction:column;}
header{padding:16px;text-align:center;font-size:24px;background:var(--header);}
.tabs{display:flex;background:var(--tabs);}
.tab{padding:12px 20px;cursor:pointer;}
.tab.active{background:var(--tabActive);}
.content{flex:1;padding:20px;}
.page{display:none;}
.page.active{display:block;}
textarea{width:100%;height:100%;border:none;padding:15px;}
.footer{display:flex;justify-content:space-between;padding:10px;}
button{background:var(--button);color:white;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;}
</style>
</head>

<body>

<div class="sidebar">
  <div class="menu-container">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="menu-dropdown" id="menuDropdown"></div>
  </div>
</div>

<div class="container">
  <div class="topbar">
    <div class="logo">AnotPanda</div>
    <button onclick="addTab()">＋ Nova Aba</button>
  </div>

  <div class="notebook">
    <header>Bloco de Notas</header>
    <div class="tabs" id="tabsContainer"></div>
    <div class="content" id="contentContainer"></div>

    <div class="footer">
      <span id="status">Tudo salvo automaticamente</span>
      <button onclick="saveAll()">💾 Salvar</button>
    </div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "blocodenotas-c81fc.firebaseapp.com",
  projectId: "blocodenotas-c81fc"
});

const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* 🔥 ID SEGURO */
function safeId(name){
  return name.replace(/[^a-zA-Z0-9]/g, "_");
}

/* LOGIN */
onAuthStateChanged(auth, (user)=>{
  if(user){
    currentUser = user;
    loadAll();
  }
});

/* ABRIR ABA */
window.openTab = function(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

  document.getElementById('tab-'+id)?.classList.add('active');
  document.getElementById(id)?.classList.add('active');
}

/* CRIAR ABA */
function createTab(name, content=""){
  const safe = safeId(name);

  let tab = document.createElement('div');
  tab.className='tab';
  tab.id='tab-'+safe;
  tab.innerText=name;
  tab.onclick=()=>openTab(safe);

  document.getElementById('tabsContainer').appendChild(tab);

  let page = document.createElement('div');
  page.className='page';
  page.id=safe;

  page.innerHTML=`<textarea id="text-${safe}">${content}</textarea>`;

  document.getElementById('contentContainer').appendChild(page);
}

/* NOVA ABA */
window.addTab = function(){
  let name = prompt("Nome:");
  if(!name) return;
  createTab(name);
}

/* SALVAR */
window.saveAll = async function(){
  let data=[];

  document.querySelectorAll('.tab').forEach(tab=>{
    let name=tab.innerText;
    let safe=safeId(name);
    let el=document.getElementById('text-'+safe);

    data.push({
      name,
      text: el ? el.value : ""
    });
  });

  await setDoc(doc(db,"notas","user"),{tabs:data});

  document.getElementById("status").innerText="Salvo!";
}

/* LOAD */
async function loadAll(){
  const snap = await getDoc(doc(db,"notas","user"));

  if(snap.exists()){
    snap.data().tabs.forEach(t=>{
      createTab(t.name,t.text);
    });
  }else{
    createTab("Notas");
  }
}

</script>

</body>
</html>
